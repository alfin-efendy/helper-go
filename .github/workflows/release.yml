name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.24'

jobs:
  # Job 1: Create GitHub release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run tests
      run: |
        go test -race -coverprofile=coverage.out ./...

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -z "$PREV_TAG" ]; then
          echo "## Changes" > CHANGELOG.md
          git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
        else
          echo "## Changes since $PREV_TAG" > CHANGELOG.md
          git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
        fi
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat CHANGELOG.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Extract tag name
      id: tag_name
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag_name.outputs.tag }}
        release_name: Release ${{ steps.tag_name.outputs.tag }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: ${{ contains(steps.tag_name.outputs.tag, '-') }}

  # Job 2: Validate release
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Validate module
      run: |
        go mod verify
        go mod tidy
        git diff --exit-code

    - name: Test as external module
      run: |
        # Create a temporary directory to test the module
        TEMP_DIR=$(mktemp -d)
        cd $TEMP_DIR
        
        # Initialize a new module
        go mod init test-module
        
        # Add our module as dependency
        go get github.com/ringkas-ai/helper-go@${{ github.ref_name }}
        
        # Create a simple test file
        cat > main.go << 'EOF'
        package main
        
        import (
            "fmt"
            "github.com/ringkas-ai/helper-go/util"
        )
        
        func main() {
            ext := util.GetFileExtension("test.go")
            fmt.Printf("Extension: %s\n", ext)
        }
        EOF
        
        # Try to build and run
        go build -o test-app .
        ./test-app

  # Job 3: Security scan for release
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run security checks
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Run Gosec
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: './...'

  # Job 4: Generate documentation
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: [release]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Generate docs
      run: |
        go install golang.org/x/tools/cmd/godoc@latest
        mkdir -p docs
        
        # Generate package documentation
        for pkg in $(go list ./...); do
          echo "## Package: $pkg" >> docs/API.md
          go doc -all $pkg >> docs/API.md
          echo "" >> docs/API.md
        done

    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/

  # Job 5: Notify on release
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [release, validate, security-scan]
    if: always() && needs.release.result == 'success'
    steps:
    - name: Extract tag name
      id: tag_name
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

    - name: Notify success
      run: |
        echo "✅ Successfully released version ${{ steps.tag_name.outputs.tag }}"
        echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag_name.outputs.tag }}"
